<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img"><title>PERCEPTION GALLERY / PRINTABLE CARDS</title><desc>Cut or point to cards. No timer is required; cover lists before recall.</desc><style>text{font-family:Arial,sans-serif;fill:#241f19}.h{font-size:6px;font-weight:700}.s{font-size:3.2px}.t{font-size:4px}.frame{fill:none;stroke:#6b6154;stroke-width:.35}.cut{fill:#fff;stroke:#241f19;stroke-width:.5;stroke-dasharray:2 1}.line{stroke:#241f19;stroke-width:.5;fill:none}</style><rect width="210" height="297" fill="white"/><text x="12" y="16" class="h">PERCEPTION GALLERY / PRINTABLE CARDS</text><text x="12" y="24" class="s">Cut or point to cards. No timer is required; cover lists before recall.</text><rect x="12" y="35" width="89" height="32" rx="2" class="cut"/><text x="17" y="45" class="t">ATRIUM</text><text x="17" y="54" class="s">Compass / Lens / Sample</text><text x="17" y="61" class="s">Practice / Check / Transfer</text><rect x="107" y="35" width="89" height="32" rx="2" class="cut"/><text x="112" y="45" class="t">FOUNTAIN</text><text x="112" y="54" class="s">Lantern / Battery / Receipt</text><text x="112" y="61" class="s">Practice / Check / Transfer</text><rect x="12" y="73" width="89" height="32" rx="2" class="cut"/><text x="17" y="83" class="t">WORKSHOP</text><text x="17" y="92" class="s">Coil / Map / Sensor</text><text x="17" y="99" class="s">Practice / Check / Transfer</text><rect x="107" y="73" width="89" height="32" rx="2" class="cut"/><text x="112" y="83" class="t">OBSERVATORY</text><text x="112" y="92" class="s">Archive / Seal / Capsule</text><text x="112" y="99" class="s">Practice / Check / Transfer</text><text x="12" y="123" class="h">Scene cards / use one column per attempt</text><rect x="12" y="132" width="59" height="63" class="cut"/><text x="15" y="142" class="t">PRACTICE</text><text x="15" y="152" class="s">Clock 08:20</text><text x="15" y="162" class="s">Blue cup by ledger</text><text x="15" y="172" class="s">Door open</text><text x="15" y="182" class="s">Note: I left first</text><rect x="75" y="132" width="59" height="63" class="cut"/><text x="78" y="142" class="t">CHECK</text><text x="78" y="152" class="s">Clock 09:40</text><text x="78" y="162" class="s">Amber cup on shelf</text><text x="78" y="172" class="s">Door closed</text><text x="78" y="182" class="s">Note: Sample intact</text><rect x="138" y="132" width="59" height="63" class="cut"/><text x="141" y="142" class="t">TRANSFER</text><text x="141" y="152" class="s">Display 14:10</text><text x="141" y="162" class="s">Flask beside map</text><text x="141" y="172" class="s">Service hatch open</text><text x="141" y="182" class="s">Report: Power failure</text><text x="12" y="210" class="t">Record one observation, one claim and one inference.</text><path d="M12 220h186M12 232h186M12 244h186M12 256h186" class="frame"/><text x="12" y="270" class="s">A visible note establishes what it says; its account still needs independent support.</text><text x="12" y="284" class="s">SLOP4408 · Print at 100% on A4. Paper models; no claim of physical apparatus validation.</text><path d="M12 289h50m-50-1v2m50-2v2" class="line"/><text x="66" y="290" class="s">50 mm scale check</text></svg>