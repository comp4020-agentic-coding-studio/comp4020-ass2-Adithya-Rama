<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img"><title>SYSTEMS / GRID AND CIRCUIT SHEET</title><desc>Model predictions explicitly. The grid is a fictional game contract, not a real sensor map.</desc><style>text{font-family:Arial,sans-serif;fill:#241f19}.h{font-size:6px;font-weight:700}.s{font-size:3.2px}.t{font-size:4px}.frame{fill:none;stroke:#6b6154;stroke-width:.35}.cut{fill:#fff;stroke:#241f19;stroke-width:.5;stroke-dasharray:2 1}.line{stroke:#241f19;stroke-width:.5;fill:none}</style><rect width="210" height="297" fill="white"/><text x="12" y="16" class="h">SYSTEMS / GRID AND CIRCUIT SHEET</text><text x="12" y="24" class="s">Model predictions explicitly. The grid is a fictional game contract, not a real sensor map.</text><text x="12" y="38" class="h">Movement Hall / row 1 is north</text><rect x="28" y="47" width="22" height="22" class="frame"/><text x="30" y="52" class="s">1,1</text><rect x="50" y="47" width="22" height="22" class="frame"/><text x="52" y="52" class="s">1,2</text><rect x="72" y="47" width="22" height="22" class="frame"/><text x="74" y="52" class="s">1,3</text><rect x="94" y="47" width="22" height="22" class="frame"/><text x="96" y="52" class="s">1,4</text><rect x="116" y="47" width="22" height="22" class="frame"/><text x="118" y="52" class="s">1,5</text><rect x="28" y="69" width="22" height="22" class="frame"/><text x="30" y="74" class="s">2,1</text><rect x="50" y="69" width="22" height="22" class="frame"/><text x="52" y="74" class="s">2,2</text><rect x="72" y="69" width="22" height="22" class="frame"/><text x="74" y="74" class="s">2,3</text><rect x="94" y="69" width="22" height="22" class="frame"/><text x="96" y="74" class="s">2,4</text><rect x="116" y="69" width="22" height="22" class="frame"/><text x="118" y="74" class="s">2,5</text><rect x="28" y="91" width="22" height="22" class="frame"/><text x="30" y="96" class="s">3,1</text><rect x="50" y="91" width="22" height="22" class="frame"/><text x="52" y="96" class="s">3,2</text><rect x="72" y="91" width="22" height="22" class="frame"/><text x="74" y="96" class="s">3,3</text><rect x="94" y="91" width="22" height="22" class="frame"/><text x="96" y="96" class="s">3,4</text><rect x="116" y="91" width="22" height="22" class="frame"/><text x="118" y="96" class="s">3,5</text><rect x="28" y="113" width="22" height="22" class="frame"/><text x="30" y="118" class="s">4,1</text><rect x="50" y="113" width="22" height="22" class="frame"/><text x="52" y="118" class="s">4,2</text><rect x="72" y="113" width="22" height="22" class="frame"/><text x="74" y="118" class="s">4,3</text><rect x="94" y="113" width="22" height="22" class="frame"/><text x="96" y="118" class="s">4,4</text><rect x="116" y="113" width="22" height="22" class="frame"/><text x="118" y="118" class="s">4,5</text><rect x="28" y="135" width="22" height="22" class="frame"/><text x="30" y="140" class="s">5,1</text><rect x="50" y="135" width="22" height="22" class="frame"/><text x="52" y="140" class="s">5,2</text><rect x="72" y="135" width="22" height="22" class="frame"/><text x="74" y="140" class="s">5,3</text><rect x="94" y="135" width="22" height="22" class="frame"/><text x="96" y="140" class="s">5,4</text><rect x="116" y="135" width="22" height="22" class="frame"/><text x="118" y="140" class="s">5,5</text><text x="142" y="58" class="s">Start: 5,1</text><text x="142" y="67" class="s">Goal: 1,5</text><text x="142" y="86" class="s">Practice sensors:</text><text x="142" y="94" class="s">row 3 / cols 1–4</text><text x="142" y="110" class="s">Check:</text><text x="142" y="118" class="s">col 2 / rows 2–5</text><text x="142" y="134" class="s">Transfer:</text><text x="142" y="142" class="s">col 4 / rows 2–5</text><text x="12" y="170" class="s">Mark sensors with X. Write route and expected contacts before moving the token.</text><text x="12" y="190" class="h">6 V model circuit / record supply and output</text><rect x="12" y="202" width="40" height="19" class="frame"/><text x="16" y="213" class="t">SOURCE</text><path d="M52 211h7" class="line"/><rect x="59" y="202" width="40" height="19" class="frame"/><text x="63" y="213" class="t">FUSE</text><path d="M99 211h7" class="line"/><rect x="106" y="202" width="40" height="19" class="frame"/><text x="110" y="213" class="t">CABLE</text><path d="M146 211h7" class="line"/><rect x="153" y="202" width="40" height="19" class="frame"/><text x="157" y="213" class="t">LAMP</text><path d="M173 221v12H32v-12" class="line"/><text x="70" y="241" class="s">Common return / define both probe points</text><text x="12" y="253" class="s">Fuse or cable supply break: find the first missing powered supply.</text><text x="12" y="261" class="s">Dark lamp with 6 V supply: isolate power, then check continuity.</text><text x="12" y="269" class="s">Verify both supply voltage and a functioning lamp after repair.</text><text x="12" y="284" class="s">SLOP4408 · Print at 100% on A4. Paper models; no claim of physical apparatus validation.</text><path d="M12 289h50m-50-1v2m50-2v2" class="line"/><text x="66" y="290" class="s">50 mm scale check</text></svg>